name: Tests and lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test and lint tools
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests

      - name: Run Ruff
        run: ruff check pillar1 pillar2 --exclude "*/legacy/*"
